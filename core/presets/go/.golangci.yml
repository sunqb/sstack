# sstack Go preset. Adjust package patterns before relying on it in CI.
# Written for golangci-lint v2 configuration. Older releases may need a migration.
version: "2"

linters:
  default: standard
  enable:
    - depguard
    - forbidigo
  settings:
    depguard:
      rules:
        boundaries:
          deny:
            - pkg: github.com/pkg/errors
              desc: use the standard library errors package
            - pkg: example.com/project/internal/infra
              desc: adjust this boundary; app/cmd should not import infra directly
    forbidigo:
      forbid:
        - pattern: fmt\.Print.*
          msg: do not call fmt.Print*; use a logger
        - pattern: panic\(
          msg: do not panic in library code; return an error
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
